<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Lost Luggage</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1b1020;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        /* Keep the game clear of notches and home indicators. */
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      canvas { cursor: crosshair; }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1b1020;
        color: #f2c14e;
        font: bold 20px/1.4 monospace;
        text-align: center;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #rotate span { display: block; font-size: 48px; }
      /* iPhone can't lock orientation, so ask nicely instead (the menu works either way). */
      @media (orientation: portrait) and (pointer: coarse) {
        body:not(.in-menu) #rotate { display: flex; }
      }
      /* Menu and lobby: plain HTML over the canvas, so typing a name or a room code uses the phone's own keyboard. */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 120%, #5a2418 0%, #1b1020 65%);
        color: #fff;
        font: bold 15px/1.3 ui-monospace, Menlo, Consolas, monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
        user-select: none;
        -webkit-user-select: none;
        overflow-y: auto;
      }
      #menu[hidden] { display: none; }
      #menu .card { width: min(420px, calc(100vw - 32px)); padding: 16px 0; text-align: center; }
      #menu h1 { margin: 0 0 4px; font-size: 32px; color: #f2c14e; text-shadow: 3px 3px 0 #a33a24; letter-spacing: 2px; }
      #menu .tag { margin: 0 0 18px; color: #c9cfd6; font-size: 12px; }
      #menu button, #menu input {
        font: inherit;
        text-transform: uppercase;
        letter-spacing: inherit;
        box-sizing: border-box;
        min-height: 48px;
        border: 2px solid #5a5060;
        background: #2a1c30;
        color: #fff;
      }
      #menu button { width: 100%; margin: 6px 0; cursor: pointer; }
      #menu button:active, #menu button:hover { border-color: #f2c14e; }
      #menu button.primary { background: #a33a24; border-color: #f2c14e; }
      #menu button:disabled { opacity: 0.5; cursor: default; }
      #menu input { width: 100%; padding: 0 12px; margin: 6px 0; user-select: text; -webkit-user-select: text; }
      #menu input:focus { outline: none; border-color: #f2c14e; }
      #menu .row { display: flex; gap: 8px; }
      #menu .row input { flex: 1; text-align: center; font-size: 20px; letter-spacing: 6px; }
      #menu .row button { width: 96px; flex: none; }
      #menu label { display: block; text-align: left; font-size: 11px; color: #c9cfd6; margin-top: 8px; }
      #menu .status { min-height: 1.3em; color: #e0533d; font-size: 12px; margin: 8px 0 0; }
      #menu .code { font-size: 48px; letter-spacing: 12px; color: #f2c14e; margin: 4px 0 2px; }
      #menu ul { list-style: none; padding: 0; margin: 12px 0; text-align: left; }
      #menu li { padding: 8px 10px; margin: 4px 0; background: #2a1c30; border-left: 6px solid; display: flex; justify-content: space-between; }
      #menu li small { color: #c9cfd6; font-size: 11px; }
      #menu .hint { color: #c9cfd6; font-size: 11px; margin: 4px 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="menu" hidden>
      <div class="card" id="home">
        <h1>LOST LUGGAGE</h1>
        <p class="tag">The cruise line is not liable.</p>
        <label for="name">Your name</label>
        <input id="name" maxlength="10" autocomplete="nickname" spellcheck="false" placeholder="TRAVELER" />
        <button id="solo" class="primary">Solo run</button>
        <button id="quick">Quick match</button>
        <button id="create">Create room for friends</button>
        <div class="row">
          <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" />
          <button id="join">Join</button>
        </div>
        <p class="status" id="status"></p>
      </div>
      <div class="card" id="lobby" hidden>
        <p class="hint">Room code</p>
        <div class="code" id="lobby-code">----</div>
        <p class="hint">Friends type this code to join. Up to 4 players.</p>
        <ul id="lobby-seats"></ul>
        <button id="start" class="primary">Start run</button>
        <p class="hint" id="lobby-wait">Waiting for the host to start...</p>
        <button id="leave">Leave</button>
        <p class="status" id="lobby-status"></p>
      </div>
    </div>
    <div id="rotate"><div><span>&#x21bb;</span>Rotate your phone.<br />The luggage won't find itself.</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
